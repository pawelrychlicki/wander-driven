name: WanderDriven

options:
  bundleIdPrefix: com.pawelrychlicki
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ServerDriven:
    path: Packages/ServerDriven

targets:
  WanderDriven:
    type: application
    platform: iOS
    sources:
      - path: WanderDriven
    resources:
      - path: WanderDriven/Resources
    dependencies:
      - package: ServerDriven
        product: ServerDrivenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawelrychlicki.WanderDriven
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  WanderDrivenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WanderDrivenUITests
    dependencies:
      - target: WanderDriven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawelrychlicki.WanderDrivenUITests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES

  WanderDrivenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WanderDrivenTests
    resources:
      - path: WanderDriven/Resources/Documents
    dependencies:
      - target: WanderDriven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawelrychlicki.WanderDrivenTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
